x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/app.db}
  SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-sqlite:////data/app.db}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  MEDIA_ROOT: /data/media

# Single source of truth: host ./data holds app.db, ./media holds uploads.
# (A previous revision stacked appdata:/data UNDER ./data:/data — the bind
# shadowed the named volume, so it was removed.)
x-app-volumes: &app-volumes
  - ./data:/data
  - ./media:/data/media

# M7: cap container log growth. json-file without rotation fills the disk
# on a long-lived host (backend+worker+beat log every minute) and takes
# the whole stack down. 5 x 10MB per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Opt-in profile: backend must ALSO get DATABASE_URL + SYNC_DATABASE_URL
  # pointing at postgres (see .env.example) — there is intentionally no
  # depends_on from backend, which stays SQLite by default.
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-igfunnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-igfunnel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-igfunnel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["postgres"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    env_file: .env
    environment:
      <<: *backend-env
    volumes:
      - ./data:/data
      - ./media:/data/media
      # NOTE: the Docker socket used to be mounted here for the Server
      # panel's per-container stats. Removed (m14): the backend runs as
      # root, so a compromised backend meant full host control. The panel
      # still shows host CPU/RAM/disk; per-container stats degrade to
      # docker=false (see app/services/host_stats.py).
    depends_on:
      redis:
        condition: service_healthy
    # --proxy-headers: trust X-Forwarded-For/Proto from nginx so slowapi
    # rate-limits see the real client IP (nginx sets the headers; the
    # backend port is not published, so only nginx can reach it directly).
    # Trust the compose subnet (see bottom of this file), NOT '*': with '*'
    # uvicorn takes the leftmost XFF entry, which the client controls, so a
    # spoofed X-Forwarded-For would bypass rate limits and the /ws per-IP
    # cap. TRUSTED_PROXY_CIDR is the single knob for both the docker subnet
    # and the uvicorn trust list — change it in .env if it collides with
    # your LAN/VPN.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=${TRUSTED_PROXY_CIDR:-172.28.0.0/16}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build: ./backend
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    logging: *default-logging
    env_file: .env
    environment:
      <<: *backend-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # --pool=solo runs a single process; --concurrency is a no-op with it
    # (kept out to avoid implying parallelism that doesn't exist).
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info --pool=solo
    healthcheck:
      # inspect ping round-trips through the broker — proves the worker is
      # alive AND consuming, not just that the process exists.
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery inspect ping --timeout 10 2>/dev/null | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  beat:
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    env_file: .env
    environment:
      <<: *backend-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # m13: the beat shelve lives on the ./data bind mount (not /code), so
    # scheduler state survives container recreates instead of going
    # ephemeral with the container filesystem.
    command: celery -A app.tasks.celery_app.celery beat --loglevel=info --schedule /data/celerybeat-schedule.db
    healthcheck:
      # Beat has no inspect interface; PID 1 liveness is the signal. The
      # scheduler writes its state via the broker, so a dead beat is
      # visible in missed periodic runs (monitored via the dashboard).
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin via nginx (default path). Set FRONTEND_API_URL
        # only when exposing this container's :3000 directly to browsers.
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-}
        API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # NOTE: 127.0.0.1, not localhost — inside the container `localhost`
      # resolves to ::1 only, while the Next.js server listens on IPv4
      # (HOSTNAME=0.0.0.0). Checking `localhost` always fails.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      # Rendered from this template by the image's own entrypoint
      # (20-envsubst-on-templates.sh): only CLIENT_MAX_BODY_SIZE is
      # substituted (NGINX_ENVSUBST_FILTER) — nginx's own $variables are
      # left untouched. Output lands on /etc/nginx/nginx.conf.
      # m11: the opt-in profile was removed — nginx is the only ingress
      # (backend/frontend publish no ports), so `docker compose up` must
      # always start it; otherwise the stack came up with zero reachable
      # ports despite the README quickstart.
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: CLIENT_MAX_BODY_SIZE
      # Keep ~10% headroom above the backend's MAX_UPLOAD_MB (default 500):
      # nginx 413s anything larger, so raising MAX_UPLOAD_MB past this
      # value silently breaks all uploads.
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-550m}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

# Fixed-subnet bridge so uvicorn can trust the proxy network by CIDR
# instead of '*'. With '*' uvicorn's ProxyHeadersMiddleware takes the
# LEFTMOST X-Forwarded-For entry, which the client controls — anyone could
# spoof their IP and walk around slowapi rate limits and the /ws per-IP
# pending-auth cap (nginx appends the real IP, but '*' reads the fake one).
# Trusting only this subnet makes uvicorn resolve the rightmost *untrusted*
# entry — the one nginx itself appended. TRUSTED_PROXY_CIDR is the single
# knob: it sets both this subnet and the backend's --forwarded-allow-ips,
# so overriding it in .env keeps the two in agreement (a Docker network
# whose subnet collides with your LAN/VPN fails to create at all).
networks:
  default:
    name: instareel-net
    driver: bridge
    ipam:
      config:
        - subnet: ${TRUSTED_PROXY_CIDR:-172.28.0.0/16}
