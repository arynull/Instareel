x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/app.db}
  SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-sqlite:////data/app.db}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  MEDIA_ROOT: /data/media

# Single source of truth: host ./data holds app.db, ./media holds uploads.
# (A previous revision stacked appdata:/data UNDER ./data:/data — the bind
# shadowed the named volume, so it was removed.)
x-app-volumes: &app-volumes
  - ./data:/data
  - ./media:/data/media

services:
  # Opt-in profile: backend must ALSO get DATABASE_URL + SYNC_DATABASE_URL
  # pointing at postgres (see .env.example) — there is intentionally no
  # depends_on from backend, which stays SQLite by default.
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-igfunnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-igfunnel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-igfunnel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["postgres"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
    volumes:
      - ./data:/data
      - ./media:/data/media
      # Read-only Docker socket for the Server panel's per-container stats.
      # The API only calls list/stats (never create/exec); without it the
      # panel still shows host CPU/RAM/disk with docker=false.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      redis:
        condition: service_healthy
    # --proxy-headers: trust X-Forwarded-For/Proto from nginx so slowapi
    # rate-limits see the real client IP (nginx sets the headers; the
    # backend port is not published, so only nginx can reach it directly).
    # FORWARDED_ALLOW_IPS defaults to '*' — tighten it if you publish :8000.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-*}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info --concurrency=2 --pool=solo
    healthcheck:
      # inspect ping round-trips through the broker — proves the worker is
      # alive AND consuming, not just that the process exists.
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery inspect ping --timeout 10 2>/dev/null | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery beat --loglevel=info
    healthcheck:
      # Beat has no inspect interface; PID 1 liveness is the signal. The
      # scheduler writes its state via the broker, so a dead beat is
      # visible in missed periodic runs (monitored via the dashboard).
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin via nginx (default path). Set FRONTEND_API_URL
        # only when exposing this container's :3000 directly to browsers.
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-}
        API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # NOTE: 127.0.0.1, not localhost — inside the container `localhost`
      # resolves to ::1 only, while the Next.js server listens on IPv4
      # (HOSTNAME=0.0.0.0). Checking `localhost` always fails.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    profiles: ["nginx"]

volumes:
  pgdata:
  redisdata:
